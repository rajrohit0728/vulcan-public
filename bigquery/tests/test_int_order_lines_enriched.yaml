test_int_order_lines_enriched:
  model: bigqueryrr.intermediate_v4_vnew.int_order_lines_enriched
  description: "Validates the @net_amount/@order_value_tier macro formulas: (quantity * unit_price) * (1 - discount_pct / 100)."
  inputs:
    bigqueryrr.staging_v4_vnew.stg_order_items:
      rows:
        - order_item_id: OI900
          order_id: O900
          product_id: P001
          quantity: 2
          unit_price: 50.00
          discount_pct: 10
    bigqueryrr.staging_v4_vnew.stg_orders:
      rows:
        - order_id: O900
          customer_id: 1
          order_date: "2024-06-01"
          order_status: Completed
          channel: Web
    bigqueryrr.staging_v4_vnew.stg_customers:
      rows:
        - customer_id: 1
          name: Alice Johnson
          email: alice.johnson@example.com
          region: US-West
          customer_tier: Gold
          signup_date: "2024-01-12"
    bigqueryrr.staging_v4_vnew.stg_products:
      rows:
        - product_id: P001
          product_name: Wireless Mouse
          category: Electronics
          brand: TechPro
          unit_cost: 12.50
          list_price: 29.99
  outputs:
    query:
      rows:
        - order_item_id: OI900
          order_id: O900
          order_date: "2024-06-01"
          order_status: Completed
          channel: Web
          customer_id: 1
          region: US-West
          product_id: P001
          product_name: Wireless Mouse
          category: Electronics
          quantity: 2
          unit_price: 50.00
          discount_pct: 10
          net_amount: 90.00
          order_value_tier: basic
