kind: dq
name: dim_products_dq
depends_on: abfsslhdepotrr.mart_v4_vnew.dim_products

profiles:
  - category
  - brand
  - margin_pct

rules:
  - row_count > 0:
      name: has_rows
      dimension: completeness
      description: "dim_products should never produce an empty result set"
  - missing_count(product_id) = 0:
      name: no_missing_product_id
      dimension: completeness
      description: "product_id is required on every dimension row"
  - duplicate_count(product_id) = 0:
      name: unique_product_id
      dimension: uniqueness
      description: "product_id should be unique per row in the dimension"
  - failed rows:
      name: no_negative_margin
      dimension: validity
      fail query: |
        SELECT product_id, margin_pct
        FROM abfsslhdepotrr.mart_v4_vnew.dim_products
        WHERE margin_pct < 0
      samples limit: 5
      description: "margin_pct should not be negative"
