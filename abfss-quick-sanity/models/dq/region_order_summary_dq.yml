kind: dq
name: region_order_summary_dq
depends_on: abfsslhdepotrr.mart_v5_vnew.region_order_summary

profiles:
  - customer_count
  - order_count
  - total_net_amount
  - avg_order_value

rules:
  - row_count > 0:
      name: has_rows
      dimension: completeness
      description: "region_order_summary should have at least one region"
  - missing_count(region) = 0:
      name: no_missing_region
      dimension: completeness
      description: "region is required on every row"
