version: v1alpha
type: custom-cloud
name: abfss-spark-dp
description: |
  Layered (staging -> intermediate -> mart) Spark + Iceberg ABFSS lakehouse data
  product. Sources mock/sample data from CSV seeds (customers, products,
  orders, order line items, a region-tier lookup) since there is no external
  readable catalog to federate from on this depot.
owner: rohitrajtmdcio
tags:
  - abfss
  - spark
  - iceberg
spec:
  runAsUser: rohitrajtmdcio
  compute: ui-dev-compute
  engine: spark
  objectStoreConnection: ui-dev:vulcan-object-store-sec-abfss
  repo:
    url: https://github.com/rajrohit0728/vulcan-public
    syncFlags:
      - "--ref=main"
      - "--submodules=off"
    baseDir: abfss-quick-sanity
    # secretId: ui-dev:git-sync-rr
  depots:
    - dataos://abfsslhdepotrr?purpose=rw
  workflow:
    logLevel: INFO
    schedule:
      crons:
        - "*/15 * * * *"
      endOn: "2027-01-01T00:00:00-00:00"
      timezone: "UTC"
      concurrencyPolicy: Forbid
    resource:
      driver:
        coreLimit: "2000m"
        cores: 1
        memory: "4G"
      executor:
        coreLimit: "2000m"
        cores: 2
        memory: "4G"
        instances: 2
    plan:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - plan
        - --auto-apply
    run:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - run
    sparkConf:
      spark.sql.catalogImplementation: "in-memory"
      spark.sql.shuffle.partitions: "8"
      spark.sql.adaptive.enabled: "true"
  api:
    replicas: 1
    logLevel: INFO
    sparkConf:
      spark.sql.catalogImplementation: "in-memory"
      spark.sql.shuffle.partitions: "8"
      spark.sql.adaptive.enabled: "true"
