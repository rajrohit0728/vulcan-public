x-trino-env: &trino-env
  # bigquery — service account key mounted at /tmp/bigquery_key.json
  BIGQUERY_PROJECT_ID: ${BIGQUERY_PROJECT_ID:-}
  BIGQUERY_PARENT_PROJECT_ID: ${BIGQUERY_PARENT_PROJECT_ID:-}

services:
  trino-coordinator:
    image: docker.io/tmdcio/trino:5.1.12
    platform: linux/amd64
    container_name: trino-coordinator
    hostname: trino-coordinator
    ports:
      - "18080:8080"
    environment:
      <<: *trino-env
    volumes:
      - ./trino/coordinator/etc:/usr/lib/trino/etc:ro
      - ./bigquery_key.json:/tmp/bigquery_key.json:ro

  trino-worker-1:
    image: docker.io/tmdcio/trino:5.1.12
    platform: linux/amd64
    container_name: trino-worker-1
    hostname: trino-worker-1
    environment:
      <<: *trino-env
    volumes:
      - ./trino/worker/etc:/usr/lib/trino/etc:ro
      - ./bigquery_key.json:/tmp/bigquery_key.json:ro
    depends_on:
      - trino-coordinator

  trino-worker-2:
    image: docker.io/tmdcio/trino:5.1.12
    platform: linux/amd64
    container_name: trino-worker-2
    hostname: trino-worker-2
    environment:
      <<: *trino-env
    volumes:
      - ./trino/worker/etc:/usr/lib/trino/etc:ro
      - ./bigquery_key.json:/tmp/bigquery_key.json:ro
    depends_on:
      - trino-coordinator
