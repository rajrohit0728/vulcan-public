version: v1alpha
type: cloud
name: gcs-spark-dpv1
description: |
  Layered (staging -> intermediate -> mart) Spark + Iceberg GCS lakehouse data
  product. Sources mock/sample data from CSV seeds (customers, products,
  orders, order line items, a region-tier lookup) since there is no external
  readable catalog to federate from on this depot.
owner: rohitrajtmdcio
tags:
  - gcs
  - spark
  - iceberg
spec:
  runAsUser: rohitrajtmdcio
  compute: engineering-compute
  engine: spark
  objectStoreConnection: engineering:vulcan-object-store-sec-gcs
  repo:
    url: https://github.com/rajrohit0728/vulcan-public
    syncFlags:
      - "--ref=main"
      - "--submodules=off"
    baseDir: vulcan-public/gcs-quick-sanity
    secretId: engineering:git-sync-rr
  depots:
    - dataos://gcslhdepot?purpose=rw
  workflow:
    logLevel: INFO
    schedule:
      crons:
        - "*/15 * * * *"
      endOn: "2027-01-01T00:00:00-00:00"
      timezone: "UTC"
      concurrencyPolicy: Forbid
    resource:
      driver:
        coreLimit: "1000m"
        cores: 1
        memory: "2G"
      executor:
        coreLimit: "1000m"
        cores: 1
        memory: "2G"
        instances: 1
    plan:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - plan
        - --auto-apply
    run:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - run
    sparkConf:
      spark.sql.catalogImplementation: "in-memory"
      spark.sql.shuffle.partitions: "8"
      spark.sql.adaptive.enabled: "true"
  api:
    replicas: 1
    logLevel: INFO
    sparkConf:
      spark.sql.catalogImplementation: "in-memory"
      spark.sql.shuffle.partitions: "8"
      spark.sql.adaptive.enabled: "true"
