- name: '"fabric"."public_shreya"."orders_ext"'
  grains: [order_id]
  columns:
    order_id: INT
    customer_id: INT
    order_date: TIMESTAMP
    warehouse_id: INT
    order_status: VARCHAR(255)
- name: '"fabric"."public_shreya"."order_items_ext"'
  grains: [order_id, item_id]
  columns:
    order_id: INT
    item_id: INT
    product_id: INT
    quantity: INT
    unit_price: DECIMAL(10, 2)
- name: '"fabric"."public_shreya"."customers_ext"'
  grains: [customer_id]
  columns:
    customer_id: INT
    region_id: INT
    name: VARCHAR(255)
    email: VARCHAR(255)
    signup_date: DATE
- name: '"fabric"."public_shreya"."products_ext"'
  grains: [product_id]
  columns:
    product_id: INT
    supplier_id: INT
    name: VARCHAR(255)
    category: VARCHAR(255)
    price: DECIMAL(10, 2)
- name: '"fabric"."public_shreya"."regions_ext"'
  grains: [region_id]
  columns:
    region_id: INT
    region_name: VARCHAR(255)
- name: '"fabric"."public_shreya"."suppliers_ext"'
  grains: [supplier_id]
  columns:
    supplier_id: INT
    region_id: INT
    name: VARCHAR(255)
- name: '"fabric"."public_shreya"."warehouses_ext"'
  grains: [warehouse_id]
  columns:
    warehouse_id: INT
    region_id: INT
    name: VARCHAR(255)
- name: '"fabric"."public_shreya"."shipments_ext"'
  grains: [shipment_id]
  columns:
    shipment_id: INT
    order_id: INT
    shipped_date: DATE
    carrier: VARCHAR(255)
- name: '"fabric"."public_shreya"."dim_dates_ext"'
  grains: [dt]
  columns:
    dt: DATE
    year: INT
    month: INT
    day_of_week: VARCHAR(255)
